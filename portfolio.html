  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:Arial, Helvetica, sans-serif; }

    body { background:#000; color:#fff; }

    header {
      position: fixed;
      top:0;
      width:100%;
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:20px 40px;
      background:rgba(0,0,0,0.6);
      z-index:100;
    }

    header h1 { font-size:18px; letter-spacing:2px; }

    header nav a {
      color:#fff;
      text-decoration:none;
      margin-left:20px;
      padding:8px 16px;
      border:1px solid #fff;
      transition:0.3s;
    }

    header nav a:hover { background:#fff; color:#000; }

    .hero {
      position:relative;
      height:500px;
      width:100%;
      overflow:hidden;
    }

    .hero video {
      position:absolute;
      top:50%;
      left:50%;
      transform:translate(-50%, -50%);
      min-width:100%;
      min-height:100%;
      object-fit:cover;
      z-index:-1;
    }

    .hero-overlay {
      position:absolute;
      top:0; left:0;
      width:100%; height:100%;
      background:rgba(0,0,0,0.5);
      z-index:0;
    }

    .hero-text {
      position:relative;
      z-index:1;
      height:100%;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      text-align:center;
    }

    .hero-text h2 { font-size:48px; letter-spacing:3px; margin-bottom:10px; }
    .hero-text p { font-size:18px; opacity:0.8; }

    .videos {
      display:grid;
      grid-template-columns:repeat(auto-fit, minmax(280px, 1fr));
      gap:30px;
      padding:80px 40px;
      background:#111;
    }

    .videos iframe { width:100%; aspect-ratio:16/9; border:none; }

}

/* horná časť – obmedzená šírka, centrovaná */
.footer-top {

.footer-socials a {
  margin-left: 20px;

  font-family: Verdana, Geneva, Tahoma, sans-serif;

.footer-socials a:hover {

  font-size: 13px;
  letter-spacing: 1px;
  opacity: 0.6;
  font-family: Verdana, Geneva, Tahoma, sans-serif;
}

/* mobil */

  .footer-top {
    flex-direction: column;
    gap: 20px;
  }

  .footer-socials a {
    margin: 0 10px;
  }
}
