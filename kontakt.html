<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Viktor Boguský | Objednávka</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}
body{background:#000;color:#fff}

/* ===== LAYOUT ===== */
.order-section{
  max-width:1200px;
  margin:80px auto;
  padding:0 20px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:40px;
}

.box{
  background:#111;
  padding:30px;
  border-radius:14px;
}

/* ===== FORM ELEMENTS ===== */
label{display:block;margin-top:15px;font-weight:600}
input,select,textarea{
  width:100%;
  padding:12px;
  margin-top:6px;
  background:#1c1c1c;
  color:#fff;
  border:none;
  border-radius:8px;
}
textarea{min-height:140px}

button{
  padding:14px;
  border:none;
  border-radius:30px;
  font-weight:700;
  cursor:pointer;
}
.primary{background:#fff;color:#000}
.secondary{background:#333;color:#fff}

/* ===== USB ===== */
.usb-info{
  margin-top:15px;
  text-align:center;
}
.usb-info img{
  width:120px;
  border-radius:10px;
  margin-bottom:10px;
}

/* ===== BUTTONS ===== */
.buttons{
  display:flex;
  gap:15px;
  margin-top:20px;
}

/* ===== PRICE ===== */
.price{
  margin-top:20px;
  font-size:22px;
  font-weight:700;
}

/* ===== MOBILE ===== */
@media(max-width:900px){
  .order-section{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<section class="order-section">

<!-- ================= LEFT – CALCULATOR ================= -->
<div class="box">
  <h2>Výber služby uskutočnite na tomto formulári</h2>

  <label>Balík</label>
  <select id="balik">
    <option value="0">-- Vyber balík --</option>
    <option value="150">Stužková – Combo Start (150€)</option>
    <option value="250">Stužková – Combo Memory (250€)</option>
    <option value="300">Stužková – Combo Premium (300€)</option>
    <option value="350">Stužková – Combo Deluxe (350€)</option>
  </select>

  <div id="fullPartsBox" style="display:none">
    <label>Celé časti (40€/časť)</label>
    <input type="number" id="fullParts" value="0" min="0">
  </div>

  <label>Doba dodania</label>
  <select id="delivery">
    <option value="0">60 dní (bez príplatku)</option>
    <option value="20">30 dní (+20€)</option>
    <option value="50">7 dní (+50€)</option>
  </select>

  <label>Počet USB (10€/ks)</label>
  <input type="number" id="usb" value="0" min="0">

  <div class="usb-info">
    <img src="P1015136-Edit.png">
    <p>USB v krabičke s názvom školy a dátumom udalosti</p>
  </div>

  <label>Zľavový kód</label>
  <input type="text" id="discount">

  <label>Typ</label>
  <select id="orderType">
    <option value="order">Objednávka – platba celá suma</option>
    <option value="reservation">Rezervácia – 50% záloha</option>
  </select>

  <div class="price">Cena: <span id="total">0</span> €</div>

  <div class="buttons">
    <button class="secondary" id="calcBtn">Iba vypočítať</button>
    <button class="primary" id="addBtn">Pridať do objednávky</button>
  </div>
</div>

<!-- ================= RIGHT – FORM ================= -->
<div class="box">
  <h2>Objednávka</h2>

  <form action="https://formspree.io/f/xjknzwew" method="POST">
    <input name="meno" placeholder="Meno a priezvisko*" required>
    <input type="email" name="email" placeholder="Email*" required>
    <input name="lokacia" placeholder="Lokalita*" required>
    <input type="date" name="datum" required>

    <textarea name="objednavka" id="summary" readonly placeholder="Vyberte službu vľavo"></textarea>
    <input type="hidden" name="cena" id="finalPrice">

    <button class="primary" type="submit">Odoslať objednávku</button>
  </form>
</div>

</section>

<script>
const balik = document.getElementById("balik");
const fullPartsBox = document.getElementById("fullPartsBox");
const fullParts = document.getElementById("fullParts");
const delivery = document.getElementById("delivery");
const usb = document.getElementById("usb");
const discount = document.getElementById("discount");
const orderType = document.getElementById("orderType");
const total = document.getElementById("total");
const summary = document.getElementById("summary");
const finalPrice = document.getElementById("finalPrice");

balik.onchange = () => {
  fullPartsBox.style.display = balik.value === "150" ? "block" : "none";
};

function calculate(){
  let price = Number(balik.value);
  if(balik.value==="150") price += fullParts.value * 40;
  price += Number(delivery.value);
  price += usb.value * 10;
  if(discount.value==="STUZKOVA2620") price *= 0.8;
  if(orderType.value==="reservation") price *= 0.5;
  total.textContent = price.toFixed(2);
  return price.toFixed(2);
}

document.getElementById("calcBtn").onclick = calculate;

document.getElementById("addBtn").onclick = ()=>{
  const price = calculate();
  summary.value =
`Balík: ${balik.options[balik.selectedIndex].text}
Celé časti: ${fullParts.value}
Dodanie: ${delivery.options[delivery.selectedIndex].text}
USB: ${usb.value} ks
Typ: ${orderType.options[orderType.selectedIndex].text}

Cena: ${price} €`;
  finalPrice.value = price;
};
</script>

</body>
</html>
