<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kontakt & Objednávka | Viktor Boguský</title>
<link rel="icon" type="image/png" href="Viktor-removebg-preview.png">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: Arial, Helvetica, sans-serif;
}

body{
  background:#000;
  color:#fff;
  padding-top:60px;
}

/* ================= HEADER ================= */

header{
  position:fixed;
  top:0;
  width:100%;
  background:rgba(0,0,0,0.85);
  backdrop-filter: blur(8px);
  z-index:1000;
}

.header-inner{
  max-width:1200px;
  margin:auto;
  padding:12px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  color:#fff;
  text-decoration:none;
  font-size:18px;
  letter-spacing:2px;
  font-weight:600;
}

nav{
  display:flex;
  gap:24px;
}

nav a{
  color:#fff;
  text-decoration:none;
  font-size:14px;
  opacity:0.85;
}

nav a:hover{opacity:1}

.menu-toggle{
  display:none;
  background:none;
  border:none;
  color:#fff;
  font-size:26px;
}

@media(max-width:768px){
  .menu-toggle{display:block}
  nav{
    position:absolute;
    top:56px;
    left:0;
    width:100%;
    background:#000;
    flex-direction:column;
    align-items:center;
    display:none;
  }
  nav.active{display:flex}
  nav a{padding:12px 0}
}

/* ================= HERO ================= */

.hero{
  height:360px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  background:linear-gradient(to bottom, rgba(0,0,0,.4), #000);
}

.hero h2{
  font-size:42px;
  letter-spacing:3px;
  font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
}

.hero p{
  margin-top:10px;
  opacity:.8;
  font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
}

/* ================= OBJEDNÁVKA ================= */

.order-wrapper{
  max-width:1200px;
  margin:auto;
  padding:80px 20px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:50px;
}

.service-selector,
.contact-form-wrapper{
  background:#111;
  padding:30px;
  border-radius:14px;
}

h2{margin-bottom:20px}

label{
  display:block;
  margin-top:15px;
  font-weight:600;
}

input, select, textarea{
  width:100%;
  padding:12px;
  margin-top:6px;
  background:#1c1c1c;
  color:#fff;
  border:none;
  border-radius:8px;
}

textarea{min-height:140px}

.usb-note{
  margin-top:10px;
  font-size:13px;
  opacity:.75;
}

.price-box{
  margin-top:20px;
  font-size:16px;
}

.buttons{
  margin-top:25px;
  display:flex;
  gap:15px;
}

button{
  padding:14px;
  border:none;
  border-radius:30px;
  font-weight:700;
  cursor:pointer;
}

#calcOnly{
  background:#333;
  color:#fff;
}

#addToOrder{
  background:#fff;
  color:#000;
}

@media(max-width:900px){
  .order-wrapper{grid-template-columns:1fr}
}

/* ================= KALENDÁR ================= */

.events-calendar{
  max-width:1100px;
  margin:80px auto;
  padding:0 20px;
  text-align:center;
}

.calendar-legend{
  display:flex;
  justify-content:center;
  gap:25px;
  margin:25px 0;
  font-size:14px;
}

.dot{
  width:12px;
  height:12px;
  border-radius:50%;
  display:inline-block;
}

.dot.reserved{background:#f1c40f}
.dot.ordered{background:#e74c3c}
.dot.private{background:#555}

.calendar-header{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:20px;
  margin-bottom:20px;
}

.calendar-header button{
  background:none;
  border:1px solid #444;
  color:#fff;
  width:40px;
  height:40px;
  border-radius:50%;
  font-size:22px;
}

.calendar-grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:10px;
}

.calendar-day{
  background:#111;
  border-radius:10px;
  min-height:90px;
  padding:10px;
  position:relative;
}

.calendar-day.empty{background:transparent}

.day-number{
  position:absolute;
  top:8px;
  right:10px;
  font-size:13px;
  opacity:.6;
}

.event-title{
  margin-top:25px;
  font-size:12px;
  line-height:1.3;
  word-break:break-word;
}

.calendar-day.reserved{border:2px solid #f1c40f}
.calendar-day.ordered{border:2px solid #e74c3c}
.calendar-day.private{border:2px solid #555}

@media(max-width:700px){
  .calendar-day{min-height:70px}
  .event-title{font-size:11px}
}

/* ================= FOOTER ================= */

.footer{
  padding:50px 20px;
  background:#000;
}

.footer-top{
  max-width:900px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  text-align:center;
}

.footer-socials a{
  margin-left:20px;
  color:#fff;
  text-decoration:none;
  opacity:.7;
}

.footer-socials a:hover{opacity:1}

.footer-bottom{
  margin-top:30px;
  text-align:center;
  font-size:13px;
  opacity:.6;
}
</style>
</head>

<body>

<header>
  <div class="header-inner">
    <a href="index.html" class="logo">Viktor Boguský</a>
    <button class="menu-toggle">☰</button>
    <nav>
      <a href="referencie.html">Referencie</a>
      <a href="omne.html">O mne</a>
      <a href="sluzby.html">Služby</a>
      <a href="portfolio.html">Portfólio</a>
      <a href="cennik.html">Cenník</a>
      <a href="kontakt.html">Kontakt</a>
    </nav>
  </div>
</header>

<section class="hero">
  <div>
    <h2>Kontakt & Objednávka</h2>
    <p>Rezervuj si termín alebo si vypočítaj cenu</p>
  </div>
</section>

<!-- 👉 SEM PATRÍ TVOJA KALKULAČKA + FORMULÁR (nezmenené) -->

<!-- ================= KALENDÁR ================= -->

<section class="events-calendar">
  <h2>Kalendár akcií</h2>

  <div class="calendar-legend">
    <span><i class="dot reserved"></i> Rezervované</span>
    <span><i class="dot ordered"></i> Objednané</span>
    <span><i class="dot private"></i> Súkromné</span>
  </div>

  <div class="calendar-header">
    <button id="prevMonth">‹</button>
    <h3 id="monthYear"></h3>
    <button id="nextMonth">›</button>
  </div>

  <div class="calendar-grid" id="calendar"></div>
</section>

<footer class="footer">
  <div class="footer-top">
    <div>
      <p>kontakt@viktorbogusky.sk</p>
      <p>+421 948 933 109</p>
    </div>
    <div class="footer-socials">
      <a href="#">Instagram</a>
      <a href="#">Facebook</a>
      <a href="#">TikTok</a>
    </div>
  </div>
  <div class="footer-bottom">Vytvoril: Viktor Boguský</div>
</footer>

<script>
const calendar = document.getElementById("calendar");
const monthYear = document.getElementById("monthYear");
let currentDate = new Date();

const events = {
  "2026-05-30": { type: "ordered", title: "Svadba P&P Ranch 13" },
  "2026-11-07": { type: "reserved", title: "Stužková – Vranov n/T" },
  "2026-11-17": { type: "private", title: "Súkromná akcia" }
};

function renderCalendar(){
  calendar.innerHTML="";
  const y=currentDate.getFullYear();
  const m=currentDate.getMonth();
  monthYear.textContent=currentDate.toLocaleDateString("sk-SK",{month:"long",year:"numeric"});
  const first=(new Date(y,m,1).getDay()+6)%7;
  const days=new Date(y,m+1,0).getDate();

  for(let i=0;i<first;i++){
    calendar.innerHTML+=`<div class="calendar-day empty"></div>`;
  }

  for(let d=1;d<=days;d++){
    const key=`${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const e=events[key];
    calendar.innerHTML+=`
      <div class="calendar-day ${e?e.type:""}">
        <div class="day-number">${d}</div>
        ${e?`<div class="event-title">${e.title}</div>`:""}
      </div>`;
  }
}

document.getElementById("prevMonth").onclick=()=>{currentDate.setMonth(currentDate.getMonth()-1);renderCalendar();}
document.getElementById("nextMonth").onclick=()=>{currentDate.setMonth(currentDate.getMonth()+1);renderCalendar();}
renderCalendar();
</script>

</body>
</html>
