<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kontakt | Viktor Boguský</title>
<link rel="icon" type="image/png" href="Viktor-removebg-preview.png">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif;}
body{background:#000;color:#fff;padding-top:60px}

/* ===== HEADER ===== */
header{
  position:fixed;top:0;width:100%;
  background:rgba(0,0,0,.85);
  backdrop-filter:blur(8px);
  z-index:1000;
}
.header-inner{
  max-width:1200px;margin:auto;
  padding:12px 20px;
  display:flex;justify-content:space-between;align-items:center;
}
.logo{color:#fff;text-decoration:none;font-weight:600;letter-spacing:2px}
nav{display:flex;gap:24px}
nav a{color:#fff;text-decoration:none;font-size:14px;opacity:.8}
nav a:hover{opacity:1}
.menu-toggle{display:none;background:none;border:none;color:#fff;font-size:26px}

@media(max-width:768px){
  .menu-toggle{display:block}
  nav{
    position:absolute;top:56px;left:0;width:100%;
    background:#000;flex-direction:column;
    align-items:center;display:none
  }
  nav.active{display:flex}
  nav a{padding:12px 0}
}

/* ===== HERO ===== */
.hero{position:relative;height:420px;overflow:hidden}
.hero video{
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);
  min-width:100%;min-height:100%;object-fit:cover
}
.hero-overlay{position:absolute;inset:0;background:rgba(0,0,0,.5)}
.hero-text{
  position:relative;height:100%;
  display:flex;flex-direction:column;
  justify-content:center;align-items:center;text-align:center
}
.hero-text h2{
  font-size:42px;
  letter-spacing:3px;
  font-family:Impact,Haettenschweiler,'Arial Narrow Bold',sans-serif;
}
.hero-text p{opacity:.8;margin-top:10px}

/* ===== KALKULAČKA + FORM ===== */
.order-wrapper{
  max-width:1200px;
  margin:80px auto;
  padding:0 20px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:50px;
}
.service-selector,.contact-form-wrapper{
  background:#111;
  padding:30px;
  border-radius:14px;
}
label{display:block;margin-top:15px;font-weight:600}
input,select,textarea{
  width:100%;padding:12px;margin-top:6px;
  background:#1c1c1c;color:#fff;border:none;border-radius:8px
}
textarea{min-height:140px}
.usb-note{font-size:13px;opacity:.75;margin-top:10px}
.price-box{margin-top:20px}
.buttons{display:flex;gap:15px;margin-top:25px}
button{padding:14px;border:none;border-radius:30px;font-weight:700;cursor:pointer}
#calcOnly{background:#333;color:#fff}
#addToOrder{background:#fff;color:#000}

@media(max-width:900px){
  .order-wrapper{grid-template-columns:1fr}
}

/* ===== KALENDÁR ===== */
.events-calendar{
  max-width:1100px;
  margin:80px auto;
  padding:0 20px;
  text-align:center;
}
.calendar-header{
  display:flex;justify-content:center;align-items:center;gap:20px;
}
.calendar-header button{
  background:none;border:1px solid #444;color:#fff;
  width:40px;height:40px;border-radius:50%;cursor:pointer;
}
.calendar-grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:10px;margin-top:25px;
}
.calendar-day{
  background:#111;
  border-radius:10px;
  min-height:90px;
  padding:8px;
  display:flex;
  flex-direction:column;
  justify-content:flex-start;
}
.day-number{
  font-size:13px;
  opacity:.6;
  align-self:flex-end;
}
.event-title{
  margin-top:8px;
  font-size:12px;
  line-height:1.3;
  word-break:break-word;
}
.calendar-day.ordered{border:2px solid #e74c3c}
.calendar-day.reserved{border:2px solid #f1c40f}
.calendar-day.private{border:2px solid #555}

@media(max-width:700px){
  .calendar-day{min-height:70px}
  .event-title{font-size:11px}
}

/* ===== FOOTER ===== */
.footer{padding:50px 20px;background:#000}
.footer-top{
  max-width:900px;margin:auto;
  display:flex;justify-content:space-between;text-align:center
}
.footer-bottom{text-align:center;margin-top:30px;font-size:13px;opacity:.6}
</style>
</head>

<body>

<header>
  <div class="header-inner">
    <a href="index.html" class="logo">Viktor Boguský</a>
    <button class="menu-toggle">☰</button>
    <nav>
      <a href="referencie.html">Referencie</a>
      <a href="omne.html">O mne</a>
      <a href="sluzby.html">Služby</a>
      <a href="portfolio.html">Portfólio</a>
      <a href="cennik.html">Cenník</a>
      <a href="kontakt.html">Kontakt</a>
    </nav>
  </div>
</header>

<section class="hero">
  <video autoplay muted loop playsinline>
    <source src="uvod_video.mp4" type="video/mp4">
  </video>
  <div class="hero-overlay"></div>
  <div class="hero-text">
    <h2>Kontakt & objednávka</h2>
    <p>Rezervácie, stužkové, svadby</p>
  </div>
</section>

<section class="order-wrapper">
  <!-- KALKULAČKA -->
  <div class="service-selector">
    <h2>Výber služby</h2>

    <label>Služba</label>
    <select id="balik">
      <option value="0">-- Vyber --</option>
      <option value="150">Stužková – Combo Start</option>
      <option value="250">Stužková – Combo Memory</option>
      <option value="400">Svadba – Wedding Record</option>
    </select>

    <label>Počet USB</label>
    <input type="number" id="usb" min="0" value="0">
    <p class="usb-note">
      1 USB zdarma + každých 5 = 1 zdarma<br>
      USB v krabičke s názvom akcie
    </p>

    <label>Zľavový kód</label>
    <input type="text" id="discount">

    <label>Typ</label>
    <select id="typeOrder">
      <option value="order">Objednávka</option>
      <option value="reservation">Rezervácia (50 %)</option>
    </select>

    <div class="price-box">
      <p>Celková cena: <strong><span id="total">0</span> €</strong></p>
      <p id="reservationInfo"></p>
    </div>

    <div class="buttons">
      <button id="calcOnly">Vypočítať</button>
      <button id="addToOrder">Pridať do objednávky</button>
    </div>
  </div>

  <!-- FORM -->
  <div class="contact-form-wrapper">
    <h2>Objednávka</h2>
    <form>
      <input placeholder="Meno a priezvisko">
      <input placeholder="Email">
      <input type="date">
      <textarea id="orderSummary" readonly></textarea>
      <button>Odoslať</button>
    </form>
  </div>
</section>

<section class="events-calendar">
  <h2>Kalendár akcií</h2>
  <div class="calendar-header">
    <button id="prevMonth">‹</button>
    <h3 id="monthYear"></h3>
    <button id="nextMonth">›</button>
  </div>
  <div class="calendar-grid" id="calendar"></div>
</section>

<footer class="footer">
  <div class="footer-bottom">Vytvoril: Viktor Boguský</div>
</footer>

<script>
/* ===== MENU ===== */
document.querySelector(".menu-toggle").onclick=()=>{
  document.querySelector("nav").classList.toggle("active")
}

/* ===== KALKULAČKA ===== */
const total=document.getElementById("total");
const reservationInfo=document.getElementById("reservationInfo");
const summary=document.getElementById("orderSummary");

function calc(){
  let price=Number(balik.value);
  let usbCount=Number(usb.value);
  let free=usbCount>0?1+Math.floor(usbCount/5):0;
  price+=Math.max(usbCount-free,0)*20;
  if(discount.value==="STUZKOVA2610")price*=0.9;
  total.textContent=price.toFixed(2);
  if(typeOrder.value==="reservation"){
    reservationInfo.textContent=`Záloha: ${(price/2).toFixed(2)} €`;
  }else reservationInfo.textContent="";
  return price.toFixed(2);
}
calcOnly.onclick=calc;
addToOrder.onclick=()=>{
  const p=calc();
  summary.value=`Služba: ${balik.options[balik.selectedIndex].text}\nCena: ${p} €`;
}

/* ===== KALENDÁR ===== */
const events={
  "2026-05-30":{type:"ordered",title:"Svadba P&P Ranch 13"},
  "2026-11-07":{type:"reserved",title:"Stužková Vranov"}
}
let d=new Date();
function render(){
  calendar.innerHTML="";
  monthYear.textContent=d.toLocaleDateString("sk-SK",{month:"long",year:"numeric"});
  let y=d.getFullYear(),m=d.getMonth();
  let first=(new Date(y,m,1).getDay()+6)%7;
  let days=new Date(y,m+1,0).getDate();
  for(let i=0;i<first;i++)calendar.innerHTML+=`<div></div>`;
  for(let i=1;i<=days;i++){
    let k=`${y}-${String(m+1).padStart(2,"0")}-${String(i).padStart(2,"0")}`;
    let e=events[k];
    calendar.innerHTML+=`
      <div class="calendar-day ${e?e.type:""}">
        <div class="day-number">${i}</div>
        ${e?`<div class="event-title">${e.title}</div>`:""}
      </div>`;
  }
}
prevMonth.onclick=()=>{d.setMonth(d.getMonth()-1);render()}
nextMonth.onclick=()=>{d.setMonth(d.getMonth()+1);render()}
render();
</script>

</body>
</html>
