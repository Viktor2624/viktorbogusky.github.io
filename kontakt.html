<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Objednávka | Viktor Boguský</title>

<style>
/* ===== ZÁKLAD ===== */
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}
body{background:#000;color:#fff;padding-top:60px}
h2{margin-bottom:15px}

/* ===== HEADER ===== */
header{
  position:fixed;top:0;width:100%;
  background:rgba(0,0,0,.85);
  backdrop-filter:blur(8px);z-index:1000
}
.header-inner{
  max-width:1200px;margin:auto;
  padding:12px 20px;
  display:flex;justify-content:space-between;align-items:center
}
.logo{color:#fff;text-decoration:none;font-weight:600}
nav{display:flex;gap:20px}
nav a{color:#fff;text-decoration:none;opacity:.8}
nav a:hover{opacity:1}

/* ===== HERO ===== */
.hero{position:relative;height:420px;overflow:hidden}
.hero video{
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);
  min-width:100%;min-height:100%;object-fit:cover
}
.hero-overlay{position:absolute;inset:0;background:rgba(0,0,0,.5)}
.hero-text{
  position:relative;height:100%;
  display:flex;flex-direction:column;
  justify-content:center;align-items:center;text-align:center
}
.hero-text h1{font-size:40px}

/* ===== HLAVNÝ OBSAH ===== */
.container{
  max-width:1200px;margin:auto;
  padding:60px 20px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:40px
}
.card{
  background:#111;
  padding:25px;
  border-radius:12px;
}

/* ===== FORM ===== */
label{display:block;margin-top:12px;font-size:14px;opacity:.8}
input,select,button{
  width:100%;
  padding:10px;
  margin-top:5px;
  border:none;border-radius:6px
}
button{
  background:#fff;color:#000;
  font-weight:600;cursor:pointer;margin-top:15px
}
button.secondary{
  background:#333;color:#fff
}

/* ===== OBJEDNÁVKA ===== */
.order-summary{
  background:#000;border:1px solid #333;
  padding:15px;border-radius:8px;margin-top:15px
}

/* ===== KALENDÁR ===== */
.calendar-box{margin-top:60px}
.calendar-header{
  display:flex;justify-content:space-between;align-items:center
}
.calendar{
  margin-top:15px;
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:5px
}
.day{
  border:1px solid #333;
  padding:6px;
  min-height:70px;
  font-size:12px
}
.day span{font-weight:600}
.ordered{background:#1c4}
.reserved{background:#c93}
.private{background:#555}
.event-title{
  font-size:10px;margin-top:4px;line-height:1.2
}

/* ===== FOOTER ===== */
footer{
  padding:40px;text-align:center;
  opacity:.6
}

/* ===== RESPONSIVE ===== */
@media(max-width:900px){
  .container{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>
  <div class="header-inner">
    <a class="logo" href="#">Viktor Boguský</a>
    <nav>
      <a href="#">Služby</a>
      <a href="#">Cenník</a>
      <a href="#">Kontakt</a>
    </nav>
  </div>
</header>

<section class="hero">
  <video autoplay muted loop playsinline>
    <source src="uvod_video.mp4" type="video/mp4">
  </video>
  <div class="hero-overlay"></div>
  <div class="hero-text">
    <h1>Objednávka služby</h1>
  </div>
</section>

<section class="container">

<!-- ===== KALKULAČKA ===== -->
<div class="card">
<h2>Výber služby uskutočnite na tomto formulári</h2>

<label>Služba</label>
<select id="service">
  <option value="stuzkova">Stužková</option>
  <option value="svadba">Svadba</option>
</select>

<label>Počet hodín</label>
<input type="number" id="hours" value="5">

<label>USB nosiče (20 € / ks)</label>
<input type="number" id="usb" value="0">

<p style="font-size:12px;opacity:.7;margin-top:8px">
1 USB zdarma + za každých 5 ďalších → 1 zdarma
</p>

<label>Zľavový kód</label>
<input type="text" id="discount" placeholder="STUZKOVA2610">

<button onclick="calculate()">Iba vypočítať</button>
<button class="secondary" onclick="addToOrder()">Pridať do objednávky</button>

<div id="calcResult" style="margin-top:15px"></div>
</div>

<!-- ===== FORM + OBJEDNÁVKA ===== -->
<div class="card">
<h2>Rezervačný formulár</h2>

<label>Meno</label>
<input type="text">

<label>Email</label>
<input type="email">

<label>Dátum konania akcie</label>
<input type="date">

<div class="order-summary" id="orderSummary">
Žiadna objednávka
</div>
</div>

</section>

<!-- ===== KALENDÁR ===== -->
<section class="container calendar-box">
<div class="card" style="grid-column:1/-1">
<div class="calendar-header">
<button onclick="prevMonth()">◀</button>
<h2 id="monthYear"></h2>
<button onclick="nextMonth()">▶</button>
</div>

<div class="calendar" id="calendar"></div>
</div>
</section>

<footer>
© Viktor Boguský
</footer>

<script>
/* ===== KALKULAČKA ===== */
function calculate(){
  const service=document.getElementById("service").value;
  const hours=+hoursEl.value;
  const usb=+usbEl.value;
  let price=(service==="svadba"?80:60)*hours;

  let freeUsb=1+Math.floor(usb/5);
  let paidUsb=Math.max(0,usb-freeUsb);
  price+=paidUsb*20;

  if(discount.value==="STUZKOVA2610") price*=0.9;

  calcResult.innerHTML="Cena spolu: <b>"+price.toFixed(2)+" €</b>";
  return price;
}

function addToOrder(){
  const total=calculate();
  const deposit=total*0.3;
  orderSummary.innerHTML=`
  <b>Objednávka</b><br>
  Celkom: ${total.toFixed(2)} €<br>
  Zaplatiť teraz: ${deposit.toFixed(2)} €<br>
  Doplatok neskôr: ${(total-deposit).toFixed(2)} €
  `;
}

/* ===== KALENDÁR ===== */
const events={
  "2026-05-30":{type:"ordered",title:"Svadba P&P Ranch 13"},
  "2025-03-20":{type:"reserved",title:"Stužková BA"},
  "2025-03-25":{type:"private",title:"Súkromné"}
};

let date=new Date();
function render(){
  calendar.innerHTML="";
  monthYear.textContent=date.toLocaleDateString("sk-SK",{month:"long",year:"numeric"});
  const y=date.getFullYear(),m=date.getMonth();
  const days=new Date(y,m+1,0).getDate();
  for(let d=1;d<=days;d++){
    const key=`${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const ev=events[key];
    calendar.innerHTML+=`
    <div class="day ${ev?ev.type:""}">
      <span>${d}</span>
      ${ev?`<div class="event-title">${ev.title}</div>`:""}
    </div>`;
  }
}
function prevMonth(){date.setMonth(date.getMonth()-1);render()}
function nextMonth(){date.setMonth(date.getMonth()+1);render()}
render();

/* helpers */
const hoursEl=document.getElementById("hours");
const usbEl=document.getElementById("usb");
const discount=document.getElementById("discount");
const calcResult=document.getElementById("calcResult");
const orderSummary=document.getElementById("orderSummary");
const calendar=document.getElementById("calendar");
const monthYear=document.getElementById("monthYear");
</script>

</body>
</html>
