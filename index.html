<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Viktor Boguský | Kamera & Postprodukcia</title>
<link rel="icon" type="image/png" href="Viktor-removebg-preview.png">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: Arial, Helvetica, sans-serif;
}

body{
  background:#000;
  color:#fff;
}

/* ================= HEADER ================= */

header{
  position:fixed;
  top:0;
  width:100%;
  background:rgba(0,0,0,0.85);
  backdrop-filter: blur(8px);
  z-index:1000;
}

.header-inner{
  max-width:1200px;
  margin:auto;
  padding:12px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  color:#fff;
  text-decoration:none;
  font-size:18px;
  letter-spacing:2px;
  font-weight:600;
}

/* NAV */
nav{
  display:flex;
  gap:24px;
}

nav a{
  color:#fff;
  text-decoration:none;
  font-size:14px;
  opacity:0.85;
}

nav a:hover{
  opacity:1;
}

/* HAMBURGER */
.menu-toggle{
  display:none;
  background:none;
  border:none;
  color:#fff;
  font-size:24px;
  cursor:pointer;
}

/* MOBILE MENU */
@media(max-width:768px){
  .menu-toggle{
    display:block;
  }

  nav{
    position:absolute;
    top:56px;
    left:0;
    width:100%;
    background:rgba(0,0,0,0.95);
    flex-direction:column;
    align-items:center;
    display:none;
  }

  nav a{
    padding:12px 0;
    font-size:15px;
  }

  nav.active{
    display:flex;
  }
}

/* BODY OFFSET */
body{
  padding-top:60px;
}

/* ================= HERO ================= */

.hero{
  position:relative;
  height:520px;
  overflow:hidden;
}

.hero video{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  min-width:100%;
  min-height:100%;
  object-fit:cover;
}

.hero-overlay{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,0.5);
}

.hero-text{
  position:relative;
  height:100%;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
}

.hero-text h2{
  font-size:48px;
  letter-spacing:3px;
  font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
}

.hero-text p{
  font-size:18px;
  opacity:0.85;
  margin-top:10px;
  font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
}

@media(max-width:768px){
  .hero{
    height:420px;
  }
  .hero-text h2{
    font-size:32px;
  }
}

/* ================= VIDEOS ================= */

.videos{
  max-width:1200px;
  margin:auto;
  padding:80px 20px;
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(300px,1fr));
  gap:30px;
}

/* ================= FOOTER ================= */

.footer{
  background:#000;
  padding:50px 20px;
}

.footer-top{
  max-width:900px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  text-align:center;
}

.footer-contact p{
  opacity:0.8;
}

.footer-socials a{
  margin-left:20px;
  color:#fff;
  text-decoration:none;
  opacity:0.7;
}

.footer-socials a:hover{
  opacity:1;
}

.footer-bottom{
  margin-top:30px;
  text-align:center;
  font-size:13px;
  opacity:0.6;
}

@media(max-width:768px){
  .footer-top{
    flex-direction:column;
    gap:20px;
  }

  .footer-socials a{
    margin:0 10px;
  }
}

.cookie-banner {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  background: #111;
  color: #fff;
  padding: 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  z-index: 9999;
  font-size: 14px;
}

.cookie-banner a {
  color: #4ea1ff;
  text-decoration: underline;
}

.cookie-buttons button {
  margin-left: 10px;
  padding: 8px 14px;
  border: none;
  cursor: pointer;
}

#accept-cookies {
  background: #4CAF50;
  color: white;
}

#reject-cookies {
  background: #555;
  color: white;
}

.hidden {
  display: none;
}

</style>
</head>

<section class="hero">

  <div class="hero-overlay"></div>
  <div class="hero-text">
    <h2>Kamera & Postprodukcia</h2>
    <p>Stužkové, svadby, eventy, klipy...</p>
  </div>
</section>

<section class="videos">
  <iframe src="https://www.youtube.com/embed/3zES1AlxCd4" allowfullscreen></iframe>
  <iframe src="https://www.youtube.com/embed/V8z1SuHkfCk" allowfullscreen></iframe> 
  <iframe src="https://www.youtube.com/embed/LnRKT-GFs0k" allowfullscreen></iframe>
  <iframe src="https://www.youtube.com/embed/9Z8BojDP5no&t=70s" allowfullscreen></iframe>
</section>

<footer class="footer">
  <div class="footer-top">
    <div class="footer-contact">
      <p>kontakt@viktorbogusky.sk</p>
      <p>+421 948 933 109</p>
    </div>

    <div class="footer-socials">
      <a href="https://www.instagram.com/vittquoo/" target="_blank">Instagram</a>
      <a href="https://www.facebook.com/profile.php?id=100079203706823" target="_blank">Facebook</a>
      <a href="https://www.tiktok.com/@viktorbogusky" target="_blank">TikTok</a>
    </div>
  </div>

  <div class="footer-bottom">
    Vytvoril: Viktor Boguský
  </div>
</footer>
