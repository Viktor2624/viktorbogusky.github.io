  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:Arial, Helvetica, sans-serif; }

    body { background:#000; color:#fff; }

  .site-header {
  position: fixed;
  top: 0;
  width: 100%;
  background: rgba(0,0,0,0.85);
  backdrop-filter: blur(8px);
  z-index: 1000;
}

.header-inner {
  max-width: 1200px;
  margin: auto;
  padding: 12px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo {
  color: #fff;
  text-decoration: none;
  font-weight: 600;
  font-size: 18px;
}

.main-nav {
  display: flex;
  gap: 24px;
}

.main-nav a {
  color: #fff;
  text-decoration: none;
  font-size: 15px;
  opacity: 0.85;
}

.main-nav a:hover {
  opacity: 1;
}

/* HAMBURGER */
.menu-toggle {
  display: none;
  background: none;
  border: none;
  color: #fff;
  font-size: 24px;
  cursor: pointer;
}

/* 📱 MOBILE */
@media (max-width: 768px) {

  .menu-toggle {
    display: block;
  }

  .main-nav {
    position: absolute;
    top: 60px;
    right: 0;
    background: rgba(0,0,0,0.95);
    flex-direction: column;
    width: 100%;
    text-align: center;
    display: none;
    padding: 16px 0;
  }

  .main-nav a {
    padding: 12px 0;
    font-size: 16px;
  }

  .main-nav.active {
    display: flex;
  }
}
<script>
  const toggle = document.querySelector('.menu-toggle');
  const nav = document.querySelector('.main-nav');

  toggle.addEventListener('click', () => {
    nav.classList.toggle('active');
  });
</script>


    .hero {
      position:relative;
      height:500px;
      width:100%;
      overflow:hidden;
    }

    .hero video {
      position:absolute;
      top:50%;
      left:50%;
      transform:translate(-50%, -50%);
      min-width:100%;
      min-height:100%;
      object-fit:cover;
      z-index:-1;
    }

    .hero-overlay {
      position:absolute;
      top:0; left:0;
      width:100%; height:100%;
      background:rgba(0,0,0,0.5);
      z-index:0;
    }

    .hero-text {
      position:relative;
      z-index:1;
      height:100%;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      text-align:center;
    }

    .hero-text h2 { font-size:48px; letter-spacing:3px; margin-bottom:10px; }
    .hero-text p { font-size:18px; opacity:0.8; }

    .videos {
      display:grid;
      grid-template-columns:repeat(auto-fit, minmax(280px, 1fr));
      gap:30px;
      padding:80px 40px;
      background:#111;
    }

    .videos iframe { width:100%; aspect-ratio:16/9; border:none; }
