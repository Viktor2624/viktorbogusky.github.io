  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:Arial, Helvetica, sans-serif; }

    body { background:#000; color:#fff; }

    header {
      position: fixed;
      top:0;
      width:100%;
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:20px 40px;
      background:rgba(0,0,0,0.6);
      z-index:100;
    }

    header h1 { font-size:18px; letter-spacing:2px; }

      /* Reset základného štýlu ul a li */
nav ul {
  list-style: none;       /* Zruší bodky */
  margin: 0;
  padding: 0;
  display: flex;          /* Horizontálne zarovnanie */
  justify-content: flex-end; /* Zarovná odkazy doprava */
  flex-wrap: wrap;        /* Zalamovanie pri menších obrazovkách */
}

nav li {
  margin: 0;
}

/* Štýl odkazov */
nav a {
  display: block;         /* Klikacia oblasť */
  color: #fff;
  text-decoration: none;
  padding: 10px 20px;
  margin-left: 10px;
  border: 1px solid #fff;
  transition: 0.3s;
}

/* Hover efekt */
nav a:hover {
  background-color: #fff;
  color: #000;
}

/* Responzívna navigácia pre mobily */
@media (max-width: 768px) {
  nav ul {
    flex-direction: column;  /* Odkazy pod sebou */
    align-items: center;     /* Na stred */
  }

  nav a {
    margin: 4px 0;           /* menšia vzdialenosť medzi odkazmi */
    padding: 8px 12px;       /* menšia klikacia oblasť */
    font-size: 14px;         /* menší text pre lepšie zapadnutie */
  }
}
    .hero {
      position:relative;
      height:500px;
      width:100%;
      overflow:hidden;
    }

    .hero video {
      position:absolute;
      top:50%;
      left:50%;
      transform:translate(-50%, -50%);
      min-width:100%;
      min-height:100%;
      object-fit:cover;
      z-index:-1;
    }

    .hero-overlay {
      position:absolute;
      top:0; left:0;
      width:100%; height:100%;
      background:rgba(0,0,0,0.5);
      z-index:0;
    }

    .hero-text {
      position:relative;
      z-index:1;
      height:100%;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      text-align:center;
    }

    .hero-text h2 { font-size:48px; letter-spacing:3px; margin-bottom:10px; }
    .hero-text p { font-size:18px; opacity:0.8; }

    .videos {
      display:grid;
      grid-template-columns:repeat(auto-fit, minmax(280px, 1fr));
      gap:30px;
      padding:80px 40px;
      background:#111;
    }

    .videos iframe { width:100%; aspect-ratio:16/9; border:none; }

    .footer {
  background: #000;
  color: #fff;
  padding: 50px 20px;
  font-family: Arial, Helvetica, sans-serif;
}

/* horná časť – obmedzená šírka, centrovaná */
.footer-top {
  max-width: 900px;          /* toto ich posunie bližšie k stredu */
  margin: 0 auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

/* kontakt vľavo */
.footer-contact {
  text-align: center;
}

.footer-contact p {
  margin: 0;
  opacity: 0.8;
  font-family: Verdana, Geneva, Tahoma, sans-serif;
}

/* sociálne siete vpravo */
.footer-socials {
  text-align: center;
}

.footer-socials a {
  margin-left: 20px;
  color: #fff;
  text-decoration: none;
  opacity: 0.7;
  transition: 0.3s;
  font-family: Verdana, Geneva, Tahoma, sans-serif;
}

.footer-socials a:hover {
  opacity: 1;
}

/* spodný text */
.footer-bottom {
  margin-top: 30px;
  text-align: center;
  font-size: 13px;
  letter-spacing: 1px;
  opacity: 0.6;
  font-family: Verdana, Geneva, Tahoma, sans-serif;
}

/* mobil */
@media (max-width: 768px) {
  .footer-top {
    flex-direction: column;
    gap: 20px;
  }

  .footer-socials a {
    margin: 0 10px;
  }
}


/* mobil */
@media (max-width: 768px) {
  .footer-top {
    flex-direction: column;
    gap: 20px;
    text-align: center;
  }

  .footer-socials a {
    margin: 0 10px;
  }
}



    @media(max-width:768px) {

    /* Základne pre mobil */
#mobile-nav {
  display: none;           /* Skryté štandardne */
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  background: #333;
  z-index: 1000;
}

#mobile-nav ul {
  list-style: none;
  margin: 0;
  padding: 5px 0;
  display: flex;
  flex-direction: column;
  align-items: center;
}

#mobile-nav li {
  margin: 3px 0;
}

#mobile-nav a {
  color: #fff;
  text-decoration: none;
  padding: 8px 16px;
  border: 1px solid #fff;
  transition: 0.3s;
}

#mobile-nav a:hover {
  background: #fff;
  color: #000;
}

/* Zobrazenie menu len na mobile */
@media (min-width: 769px) {
  #mobile-nav {
    display: none !important; /* Desktop neukazuje */
  }
}

<script>
const mobileNav = document.getElementById('mobile-nav');

window.addEventListener('scroll', () => {
  if(window.scrollY === 0) {
    mobileNav.style.display = 'flex';  // Zobraz menu, keď sme úplne hore
  } else {
    mobileNav.style.display = 'none';  // Skryj menu pri scrollovaní dole
  }
});
</script>
